version: 2
updates:
  # GitHub Actions の更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python 依存（pyproject.toml）の更新
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # フロントエンド（npm）の更新
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
