name: CI

# PR と dev・main への push で実行する
on:
  pull_request:
  push:
    branches: [dev, main]

# 連続 push 時に古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 既定は読み取りのみ。必要なジョブでのみ権限を追加する。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ローカルと同一環境（コンテナ内）でテストするためのDB。CI用の固定認証情報。
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: price_games
          POSTGRES_PASSWORD: price_games
          POSTGRES_DB: price_games
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_games"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # 公式 action（actions/*）はタグ運用で可
      - uses: actions/checkout@v4

      - name: Docker イメージをビルド
        run: docker build -t price-games-ci .

      # Dockerfile と同一環境で lint / 型 / test を実行する
      - name: lint / 型チェック / test
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgresql+psycopg://price_games:price_games@localhost:5432/price_games" \
            price-games-ci sh -c "ruff check app tests && mypy app && pytest"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存インストール
        run: npm ci

      - name: 型チェック / ビルド
        run: npm run build

      - name: テスト実行
        run: npm run test
