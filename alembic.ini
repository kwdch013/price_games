# Alembic 設定。接続情報（DATABASE_URL）は env.py で環境変数から読むため、
# ここには sqlalchemy.url を書かない（パスワードをファイルに残さない）。
[alembic]
script_location = alembic
# alembic 実行時にリポジトリルートを import パスへ追加し、app パッケージを解決する
prepend_sys_path = .
# prepend_sys_path の区切りを OS 標準に固定する（将来の既定変更に備える）
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
